<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누구에게 마음이 가나요? · 인간관계와 예절 오프닝 활동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F4F5F8;
    --surface: #FFFFFF;
    --ink: #1D2433;
    --ink-2: #4A5366;
    --ink-3: #8790A2;
    --line: #E3E6EC;
    --navy: #1F2A44;
    --focus: #3F6FD8;
    --radius: 18px;
    --A: #55783A; --A-soft: #EDF3E6;
    --B: #E3802C; --B-soft: #FDF0E2;
    --C: #C95656; --C-soft: #FBE9E9;
    --D: #3C7DB7; --D-soft: #E6F0FA;
    --E: #D69A2E; --E-soft: #FCF3E0;
    --F: #8A5FB4; --F-soft: #F1EAF8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 18px 64px; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .course { font-size: 13px; color: var(--ink-3); }
  .steps { display: flex; gap: 6px; }
  .steps span { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
  .steps span.on { background: var(--navy); }

  /* intro */
  .intro { max-width: 620px; margin: 6vh auto 0; text-align: left; }
  .intro h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.25; margin: 0 0 18px; letter-spacing: -0.02em; }
  .intro p { color: var(--ink-2); margin: 0 0 12px; font-size: 17px; }
  .faces { display: grid; grid-template-columns: repeat(6, minmax(0, 72px)); gap: 8px; margin: 28px 0 32px; }
  .faces img { width: 100%; height: auto; border-radius: 14px; display: block; }
  .note { font-size: 13px; color: var(--ink-3); margin-top: 18px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 14px; padding: 14px 24px; cursor: pointer;
    background: var(--navy); color: #fff; font-weight: 700; font-size: 16px;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1.5px solid var(--line); }
  .btn:focus-visible, .card:focus-visible, .seg button:focus-visible, .swap:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* question header */
  .qhead { margin-bottom: 22px; }
  .qlabel { font-size: 14px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; }
  .qhead h2 { font-size: clamp(21px, 3.6vw, 28px); line-height: 1.35; margin: 0; letter-spacing: -0.01em; }
  .qhead p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--line);
    overflow: hidden; text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column;
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .card:hover { border-color: var(--c); box-shadow: 0 6px 20px rgba(29,36,51,.08); }
  .card:active { transform: scale(.995); }
  .card.static { cursor: default; }
  .card.static:hover { border-color: var(--line); box-shadow: none; }
  .card img { width: 100%; height: auto; display: block; }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--cs); color: var(--c); }
  .card ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 15px; }
  .card li { margin-bottom: 4px; }
  .pick { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--c); }

  /* selected view */
  .chosen-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; flex: none; }
  .chosen-head h2 { margin: 0; font-size: clamp(20px, 3.4vw, 26px); }
  .seg { display: inline-flex; background: #E9ECF1; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: 0; background: transparent; padding: 9px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .solo { max-width: 760px; }
  .solo .card { flex-direction: row; align-items: flex-start; }
  .solo .card img { width: 42%; height: auto; flex: none; }
  .others { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .others .card ul { font-size: 14px; }
  .swap { align-self: flex-start; border: 1.5px solid var(--c); color: var(--c); background: transparent; border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: auto; }

  .answer { margin-top: 26px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px; max-width: 760px; }
  .answer label { display: block; font-weight: 700; font-size: 17px; line-height: 1.45; margin-bottom: 12px; }
  textarea { width: 100%; min-height: 130px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; font-size: 16px; line-height: 1.6; background: #FBFBFD; }
  textarea:focus { border-color: var(--focus); background: #fff; outline: none; }
  .count { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  /* result (screenshot-ready) */
  .result { max-width: 440px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 20px 18px 16px; }
  .result h2 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .result .sub { font-size: 12px; color: var(--ink-3); margin: 2px 0 14px; }
  .rrow { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: var(--cs); margin-bottom: 10px; }
  .rrow img { width: 64px; height: auto; border-radius: 12px; flex: none; align-self: flex-start; }
  .rrow .q { font-size: 12px; font-weight: 700; color: var(--c); }
  .rrow .who { font-size: 18px; font-weight: 800; line-height: 1.3; }
  .rrow .why { font-size: 14px; line-height: 1.5; margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rfoot { font-size: 14px; font-weight: 700; padding-top: 10px; margin-top: 2px; border-top: 1px dashed var(--line); }
  .guide { max-width: 440px; margin: 16px auto 0; text-align: center; color: var(--ink-2); font-size: 14px; }
  .actions.center { justify-content: center; max-width: 440px; margin: 12px auto 0; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) {
    .wrap { padding: 16px 14px 56px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .solo .card { flex-direction: column; }
    .solo .card img { width: 100%; }
      .seg { display: flex; }
    .seg button { flex: 1; padding: 9px 8px; font-size: 14px; }
  }
</style>
</head>

  <div class="topbar">
    <div class="course">2026 인간관계와 예절 · 오프닝 활동</div>
    <div class="steps" aria-hidden="true"><span id="st1"></span><span id="st2"></span></div>
  </div>
  <main id="app" aria-live="polite"></main>
</div>

  const inner = `
    <img src="${IMG[k]}" alt="인물 ${k}의 그림">
    <div class="body">
      <div class="chips">${p.kw.map((w) => `<span class="chip">${w}</span>`).join("")}</div>
      <ul>${p.items.map((t) => `<li>${t}</li>`).join("")}</ul>
      ${mode === "pick" ? `<span class="pick">${k} 선택하기 →</span>` : ""}
      ${mode === "swap" ? `<button class="swap" data-swap="${k}">${k}로 바꾸기</button>` : ""}
    </div>`;
  if (mode === "pick") return `<button class="card" style="${vars(k)}" data-pick="${k}" aria-label="인물 ${k} 선택">${inner}</button>`;
  return `<article class="card static" style="${vars(k)}">${inner}</article>`;
}

function render() {
  document.getElementById("st1").className = S.screen !== "intro" ? "on" : "";
  document.getElementById("st2").className = S.screen === "done" || S.step === 1 ? "on" : "";
  if (S.screen === "intro") return renderIntro();
  if (S.screen === "done") return renderDone();
  const q = Q[S.step], a = S[q.key];
  if (S.view === "grid" || !a.pick) return renderGrid(q);
  renderChosen(q, a);
}

function renderIntro() {
  app.innerHTML = `
    <section class="intro">
      <h1>누구에게<br>마음이 가나요?</h1>
      <p>여섯 사람에 대한 짧은 소개를 읽고, 두 가지 질문에 답해 보세요.</p>
      <p>정답은 없습니다. 옆 사람의 선택은 신경 쓰지 말고, 내 마음이 가는 대로 골라 보세요.</p>
      <div class="faces">${Object.keys(P).map((k) => `<img src="${IMG[k]}" alt="">`).join("")}</div>
      <button class="btn" id="start">시작하기</button>
      <div class="note">응답은 이 기기에만 저장되며 어디에도 전송되지 않습니다.</div>
    </section>`;
  document.getElementById("start").onclick = () => { S.screen = "q"; S.step = 0; S.view = "grid"; save(); render(); window.scrollTo(0, 0); };
}

function renderGrid(q) {
  app.innerHTML = `
    <div class="qhead">
      <div class="qlabel">${q.label} / 2</div>
      <h2>${q.title}</h2>
      <p>여섯 사람의 소개를 모두 읽어 본 뒤, 한 사람을 눌러 선택하세요.</p>
    </div>
    <div class="grid">${S.order.map((k) => cardHTML(k, "pick")).join("")}</div>`;
  app.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
    S[q.key].pick = b.dataset.pick; S.view = "chosen"; S.tab = "mine"; save(); render(); window.scrollTo(0, 0);
  });
}

function renderChosen(q, a) {
  const k = a.pick;
  const others = S.order.filter((x) => x !== k);
  app.innerHTML = `
    <div class="qhead"><div class="qlabel">${q.label} / 2</div></div>
    <div class="chosen-head">
      <div class="badge" style="background: var(--${k})">${k}</div>
      <h2>내가 고른 사람은 ${k}입니다</h2>
    </div>
    <div class="seg" role="group" aria-label="설명 보기 전환">
      <button data-tab="mine" aria-pressed="${S.tab === "mine"}">선택한 인물 설명 보기</button>
      <button data-tab="others" aria-pressed="${S.tab === "others"}">다른 인물 설명 보기</button>
    </div>
    ${S.tab === "mine"
      ? `<div class="solo">${cardHTML(k, "view")}</div>`
      : `<div class="others">${others.map((x) => cardHTML(x, "swap")).join("")}</div>`}
    <div class="answer">
      <label for="why">${q.ask(k)}</label>
      <textarea id="why" maxlength="100" placeholder="나의 생각을 자유롭게 적어 보세요. (100자 이내)">${esc(a.why)}</textarea>
      <div class="count" id="count"></div>
      <div class="actions">
        <button class="btn ghost" id="back">다시 고르기</button>
        <button class="btn" id="next">${S.step === 0 ? "다음 질문으로" : "응답 마치기"}</button>
      </div>
    </div>`;
  const ta = document.getElementById("why"), next = document.getElementById("next"), count = document.getElementById("count");
  const sync = () => {
    a.why = ta.value; save();
    const n = ta.value.trim().length;
    next.disabled = n < 5;
    count.textContent = n < 5 ? "한 문장 이상 적으면 다음으로 넘어갈 수 있어요." : `${n} / 100자`;
  };
  ta.addEventListener("input", sync); sync();
  app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); });
  app.querySelectorAll("[data-swap]").forEach((b) => b.onclick = () => { a.pick = b.dataset.swap; S.tab = "mine"; save(); render(); window.scrollTo(0, 0); });
  document.getElementById("back").onclick = () => { S.view = "grid"; save(); render(); window.scrollTo(0, 0); };
  next.onclick = () => {
    if (S.step === 0) { S.step = 1; S.view = "grid"; } else { S.screen = "done"; }
    save(); render(); window.scrollTo(0, 0);
  };
}

const HEX = { A: ["#55783A", "#EDF3E6"], B: ["#E3802C", "#FDF0E2"], C: ["#C95656", "#FBE9E9"], D: ["#3C7DB7", "#E6F0FA"], E: ["#D69A2E", "#FCF3E0"], F: ["#8A5FB4", "#F1EAF8"] };
const SUB = "2026 인간관계와 예절 · 오프닝 활동";
const footText = () => S.like.pick === S.friend.pick ? "두 질문 모두 같은 사람을 골랐습니다." : "호감이 가는 사람과 친구가 되고 싶은 사람이 달랐습니다.";

function renderDone() {
  const row = (q) => {
    const a = S[q.key], k = a.pick;
    return `<div class="rrow" style="${vars(k)}">
      <img src="${IMG[k]}" alt="인물 ${k}">
      <div><div class="q">${q.sum}</div><div class="who">${k}</div><div class="why">${esc(a.why)}</div></div>
    </div>`;
  };
  app.innerHTML = `
    <section class="result" id="result">
      <h2>나의 선택</h2>
      <div class="sub">${SUB}</div>
      ${row(Q[0])}${row(Q[1])}
      <div class="rfoot">${footText()}</div>
    </section>
    <p class="guide">이 화면을 캡처하거나 아래 버튼으로 이미지를 저장해서<br>수업 오픈채팅방에 올려 주세요.</p>
    <div class="actions center">
      <button class="btn" id="saveimg">이미지로 저장 · 공유</button>
      <button class="btn ghost" id="again">처음부터 다시 하기</button>
    </div>`;
  document.getElementById("saveimg").onclick = exportImage;
  document.getElementById("again").onclick = () => {
    if (!confirm("지금까지의 응답이 지워집니다. 처음부터 다시 할까요?")) return;
    S = fresh(); save(); render(); window.scrollTo(0, 0);
  };
}

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(ctx, text, maxW) {
  const lines = [];
  text.replace(/\r/g, "").split("\n").forEach((para) => {
    let line = "";
    para.split(/(\s+)/).forEach((tok) => {
      if (!tok) return;
      const test = line + tok;
      if (ctx.measureText(test).width <= maxW) { line = test; return; }
      if (line.trim()) { lines.push(line.trimEnd()); line = ""; }
      if (/^\s+$/.test(tok)) return;
      for (const ch of tok) {
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
      }
    });
    lines.push(line.trimEnd());
  });
  return lines;
}

async function exportImage() {
  const btn = document.getElementById("saveimg");
  btn.disabled = true; btn.textContent = "이미지 만드는 중…";
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const FF = '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const W = 1080, M = 40, P = 52, IMGS = 150, RP = 32, LH = 50;
    const c = document.createElement("canvas"), ctx = c.getContext("2d");
    const textX = M + P + RP + IMGS + 36, textW = W - textX - (M + P + RP);
    ctx.font = `500 34px ${FF}`;
    const rows = Q.map((q) => {
      const a = S[q.key];
      const lines = wrap(ctx, a.why.trim(), textW);
      const h = Math.max(IMGS, 38 + 56 + 10 + lines.length * LH) + RP * 2;
      return { q, k: a.pick, lines, h };
    });
    const H = M + P + 64 + 46 + 30 + rows.reduce((t, r) => t + r.h + 24, 0) + 30 + 50 + P + M;
    c.width = W; c.height = H;
    ctx.fillStyle = "#F4F5F8"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF"; rr(ctx, M, M, W - M * 2, H - M * 2, 48); ctx.fill();
    ctx.strokeStyle = "#E3E6EC"; ctx.lineWidth = 3; ctx.stroke();
    let y = M + P;
    ctx.textBaseline = "top";
    ctx.fillStyle = "#1D2433"; ctx.font = `800 54px ${FF}`; ctx.fillText("나의 선택", M + P, y); y += 64;
    ctx.fillStyle = "#8790A2"; ctx.font = `500 30px ${FF}`; ctx.fillText(SUB, M + P, y); y += 46 + 30;
    for (const r of rows) {
      const [col, soft] = HEX[r.k];
      ctx.fillStyle = soft; rr(ctx, M + P, y, W - (M + P) * 2, r.h, 32); ctx.fill();
      const img = await loadImg(IMG[r.k]);
      ctx.save(); rr(ctx, M + P + RP, y + RP, IMGS, IMGS, 26); ctx.clip();
      const sc = Math.min(IMGS / img.width, IMGS / img.height), dw = img.width * sc, dh = img.height * sc; ctx.drawImage(img, M + P + RP + (IMGS - dw) / 2, y + RP + (IMGS - dh) / 2, dw, dh); ctx.restore();
      let ty = y + RP;
      ctx.fillStyle = col; ctx.font = `700 30px ${FF}`; ctx.fillText(r.q.sum, textX, ty); ty += 38;
      ctx.fillStyle = "#1D2433"; ctx.font = `800 46px ${FF}`; ctx.fillText(r.k, textX, ty); ty += 56 + 10;
      ctx.font = `500 34px ${FF}`; r.lines.forEach((ln) => { ctx.fillText(ln, textX, ty); ty += LH; });
      y += r.h + 24;
    }
    y += 6;
    ctx.strokeStyle = "#D5D9E0"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(M + P, y); ctx.lineTo(W - M - P, y); ctx.stroke(); ctx.setLineDash([]);
    y += 24;
    ctx.fillStyle = "#1D2433"; ctx.font = `700 34px ${FF}`; ctx.fillText(footText(), M + P, y);

    const blob = await new Promise((res) => c.toBlob(res, "image/png"));
    const file = new File([blob], "나의선택.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "나의 선택" }); }
      catch (e) { if (e.name !== "AbortError") throw e; }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "나의선택.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (e) {
    alert("이미지를 만들지 못했어요. 화면을 캡처해서 올려 주세요.");
  } finally {
    btn.disabled = false; btn.textContent = "이미지로 저장 · 공유";
  }
}

render();
</script>
</body>
